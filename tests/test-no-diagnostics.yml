name: Test installation with diagnostics disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          diagnostic-endpoint: ""
          github-token: ${{ github.token }}
          trust-runner-user: true
          summarize: false
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix command not found"
            exit 1
          fi
          echo "nix found at: $(command -v nix)"
          echo "PASS"
      - name: Assert nix daemon is running
        run: |
          echo "Checking nix daemon..."
          # Try a simple nix operation to verify daemon connectivity
          if ! nix store ping 2>/dev/null && ! nix-store --version &>/dev/null; then
            echo "WARN: nix store ping failed, but nix binary exists"
          fi
          # At minimum, nix --version must work
          NIX_VERSION="$(nix --version)"
          echo "nix version: $NIX_VERSION"
          if [ -z "$NIX_VERSION" ]; then
            echo "FAIL: nix --version returned empty"
            exit 1
          fi
          echo "PASS"
