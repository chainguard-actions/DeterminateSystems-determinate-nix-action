name: Test basic install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          summarize: "false"
          diagnostic-endpoint: ""
      - name: Assert nix is installed and runs
        run: |
          NIX_BIN="$(command -v nix || true)"
          if [ -z "$NIX_BIN" ] && [ -x /nix/var/nix/profiles/default/bin/nix ]; then
            NIX_BIN=/nix/var/nix/profiles/default/bin/nix
          fi
          echo "nix binary: $NIX_BIN"
          if [ -z "$NIX_BIN" ]; then
            echo "FAIL: nix binary not found"
            exit 1
          fi
          VERSION="$("$NIX_BIN" --version)"
          echo "version: $VERSION"
          if ! echo "$VERSION" | grep -qi "nix"; then
            echo "FAIL: unexpected nix --version output"
            exit 1
          fi
          if [ ! -d /nix/store ]; then
            echo "FAIL: /nix/store missing"
            exit 1
          fi
          echo "PASS"
