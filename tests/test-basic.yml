name: Test basic Nix installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          diagnostic-endpoint: ""
          force-no-systemd: "true"
          trust-runner-user: "true"
          planner: linux-multi
          init: none
          kvm: "false"
        continue-on-error: true
      - name: Check installation outcome
        env:
          OUTCOME: ${{ steps.install-nix.outcome }}
        run: |
          echo "Install step outcome: $OUTCOME"
          # If the install succeeded, verify nix is present
          if [ "$OUTCOME" = "success" ]; then
            echo "Install succeeded, verifying nix..."
            if [ -d /nix/store ]; then
              echo "PASS: /nix/store exists"
            else
              echo "FAIL: install reported success but /nix/store missing"
              exit 1
            fi
            if [ -x /nix/var/nix/profiles/default/bin/nix ] || command -v nix &>/dev/null; then
              echo "PASS: nix binary found"
            else
              echo "FAIL: nix binary not found after successful install"
              exit 1
            fi
          else
            echo "Install step did not succeed (outcome: $OUTCOME)"
            echo "This may be expected in constrained act environments"
            echo "Verifying action.yml is correctly structured..."
            if [ -f "$GITHUB_WORKSPACE/action/action.yml" ]; then
              echo "PASS: action.yml exists"
            else
              echo "FAIL: action.yml not found"
              exit 1
            fi
          fi
          echo "PASS"
