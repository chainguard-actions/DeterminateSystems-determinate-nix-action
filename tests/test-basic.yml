name: Test basic Nix installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          diagnostic-endpoint: ""
          _internal-strict-mode: true
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix >/dev/null 2>&1; then
            echo "FAIL: nix command not found on PATH"
            exit 1
          fi
          echo "nix found at: $(command -v nix)"
          echo "PASS"
      - name: Assert nix version is reported
        run: |
          echo "Checking nix --version..."
          NIX_VERSION=$(nix --version 2>&1)
          echo "nix version: $NIX_VERSION"
          if [ -z "$NIX_VERSION" ]; then
            echo "FAIL: nix --version returned empty output"
            exit 1
          fi
          echo "PASS"
