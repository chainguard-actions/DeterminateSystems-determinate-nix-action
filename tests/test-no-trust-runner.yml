name: Test with trust-runner-user disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          trust-runner-user: false
          summarize: false
          diagnostic-endpoint: ""
          _internal-strict-mode: false
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix binary not found in PATH"
            exit 1
          fi
          echo "nix found at: $(command -v nix)"
          echo "PASS: nix is installed even without trust-runner-user"
      - name: Assert nix store exists
        run: |
          echo "Checking /nix/store..."
          if [ ! -d /nix/store ]; then
            echo "FAIL: /nix/store directory does not exist"
            exit 1
          fi
          echo "PASS: /nix/store exists"
