name: Test Nix installation without trusting runner user
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          diagnostic-endpoint: ""
          trust-runner-user: false
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix command not found on PATH"
            exit 1
          fi
          echo "nix found at: $(command -v nix)"
          nix --version
          echo "PASS"
