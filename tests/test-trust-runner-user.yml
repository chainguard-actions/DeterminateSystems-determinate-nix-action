name: Test Nix installation with trust-runner-user disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          diagnostic-endpoint: ""
          force-no-systemd: true
          github-token: ${{ github.token }}
          trust-runner-user: false
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix >/dev/null 2>&1; then
            echo "FAIL: nix binary not found on PATH"
            exit 1
          fi
          NIX_VERSION="$(nix --version 2>&1)"
          echo "nix version: $NIX_VERSION"
          echo "PASS: nix is installed with trust-runner-user=false: $NIX_VERSION"
      - name: Assert nix store is accessible
        run: |
          echo "Checking /nix/store..."
          if [ ! -d /nix/store ]; then
            echo "FAIL: /nix/store directory not found"
            exit 1
          fi
          echo "PASS: /nix/store exists"
