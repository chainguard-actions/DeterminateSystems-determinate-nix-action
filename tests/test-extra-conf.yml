name: Test extra-conf
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          summarize: false
          diagnostic-endpoint: ""
          extra-conf: |
            max-jobs = 7
      - name: Assert extra-conf landed in nix configuration
        run: |
          ls -la /etc/nix || true
          for f in /etc/nix/nix.conf /etc/nix/nix.custom.conf; do
            if [ -f "$f" ]; then
              echo "== $f =="
              cat "$f"
            fi
          done
          if cat /etc/nix/nix.conf /etc/nix/nix.custom.conf 2>/dev/null | grep -qE '^\s*max-jobs\s*=\s*7'; then
            echo "PASS: extra-conf found"
          else
            echo "FAIL: 'max-jobs = 7' not found in nix configuration"
            exit 1
          fi
