name: Test Nix installation with extra-conf
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          diagnostic-endpoint: ""
          force-no-systemd: true
          trust-runner-user: true
          extra-conf: |
            max-jobs = 4
          _internal-strict-mode: false
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix >/dev/null 2>&1; then
            echo "FAIL: nix command not found"
            exit 1
          fi
          echo "PASS: nix found at $(command -v nix)"
      - name: Assert extra-conf was applied
        run: |
          echo "Checking nix.conf for extra configuration..."
          if [ ! -f /etc/nix/nix.conf ]; then
            echo "FAIL: /etc/nix/nix.conf does not exist"
            exit 1
          fi
          echo "Contents of /etc/nix/nix.conf:"
          cat /etc/nix/nix.conf
          if ! grep -q "max-jobs" /etc/nix/nix.conf; then
            echo "FAIL: extra-conf 'max-jobs' not found in /etc/nix/nix.conf"
            exit 1
          fi
          echo "PASS: extra-conf found in nix.conf"
