name: Test extra-conf option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          extra-conf: |
            max-jobs = 4
          diagnostic-endpoint: ""
          _internal-strict-mode: false
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix binary not found in PATH"
            exit 1
          fi
          echo "PASS: nix is installed"
      - name: Assert extra-conf was applied
        run: |
          echo "Checking /etc/nix/nix.conf for extra-conf settings..."
          if [ ! -f /etc/nix/nix.conf ]; then
            echo "FAIL: /etc/nix/nix.conf does not exist"
            exit 1
          fi
          echo "Contents of /etc/nix/nix.conf:"
          cat /etc/nix/nix.conf
          if ! grep -q "max-jobs" /etc/nix/nix.conf; then
            echo "FAIL: extra-conf setting 'max-jobs' not found in /etc/nix/nix.conf"
            exit 1
          fi
          echo "PASS: extra-conf setting found in nix.conf"
