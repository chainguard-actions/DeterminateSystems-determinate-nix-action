name: Test Nix installation with extra-conf
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          diagnostic-endpoint: ""
          force-no-systemd: true
          trust-runner-user: true
          kvm: false
          extra-conf: |
            max-jobs = 2
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix >/dev/null 2>&1; then
            if [ -f /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
              . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
            elif [ -f "$HOME/.nix-profile/etc/profile.d/nix.sh" ]; then
              . "$HOME/.nix-profile/etc/profile.d/nix.sh"
            fi
          fi
          NIX_PATH="$(command -v nix 2>/dev/null || echo '')"
          echo "nix path: $NIX_PATH"
          if [ -z "$NIX_PATH" ]; then
            echo "FAIL: nix binary not found after installation"
            exit 1
          fi
          echo "PASS: nix is installed at $NIX_PATH"
      - name: Assert extra-conf was applied
        run: |
          echo "Checking nix.conf for extra-conf settings..."
          if [ -f /etc/nix/nix.conf ]; then
            echo "Contents of /etc/nix/nix.conf:"
            cat /etc/nix/nix.conf
            if grep -q "max-jobs" /etc/nix/nix.conf; then
              echo "PASS: extra-conf setting 'max-jobs' found in /etc/nix/nix.conf"
            else
              echo "FAIL: extra-conf setting 'max-jobs' not found in /etc/nix/nix.conf"
              exit 1
            fi
          else
            echo "FAIL: /etc/nix/nix.conf does not exist"
            exit 1
          fi
