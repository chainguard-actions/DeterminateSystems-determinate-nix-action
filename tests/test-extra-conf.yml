name: Test Nix installation with extra-conf
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          diagnostic-endpoint: ""
          extra-conf: |
            max-jobs = 2
          trust-runner-user: "true"
          _internal-strict-mode: "true"
      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix command not found"
            exit 1
          fi
          echo "nix found at: $(command -v nix)"
          echo "PASS"
      - name: Assert nix.conf contains extra-conf setting
        run: |
          echo "Checking /etc/nix/nix.conf for max-jobs setting..."
          if [ ! -f /etc/nix/nix.conf ]; then
            echo "FAIL: /etc/nix/nix.conf not found"
            exit 1
          fi
          cat /etc/nix/nix.conf
          if ! grep -q "max-jobs" /etc/nix/nix.conf; then
            echo "FAIL: max-jobs not found in /etc/nix/nix.conf"
            exit 1
          fi
          echo "PASS: max-jobs found in nix.conf"
